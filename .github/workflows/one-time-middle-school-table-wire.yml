name: One-time middle-school table wire

on:
  push:
    branches:
      - feat/middle-school-quick-links-table-v2-20260809
    paths:
      - .github/workflows/one-time-middle-school-table-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/middle-school-quick-links-table-v2-20260809
          fetch-depth: 0
      - name: Wire the table into the middle-school landing page
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/pages/chativat-beynayim/index.astro';
          let text = fs.readFileSync(file, 'utf8');
          const importMarker = "import HamchashotEmbed from '../../components/HamchashotEmbed.astro';";
          const importLine = "import MiddleSchoolQuickLinks from '../../components/MiddleSchoolQuickLinks.astro';";
          const bodyMarker = `    </header>\n  </div>\n\n  <section class="split3" aria-label="בחירת שכבה">`;
          const bodyReplacement = `    </header>\n\n    <MiddleSchoolQuickLinks />\n  </div>\n\n  <section class="split3" aria-label="בחירת שכבה">`;
          const count = (source, needle) => source.split(needle).length - 1;
          if (count(text, importMarker) !== 1) throw new Error('Unexpected HamchashotEmbed import marker count');
          if (count(text, importLine) !== 0) throw new Error('MiddleSchoolQuickLinks import already exists');
          if (count(text, bodyMarker) !== 1) throw new Error('Unexpected page-head/split3 marker count');
          text = text.replace(importMarker, `${importMarker}\n${importLine}`);
          text = text.replace(bodyMarker, bodyReplacement);
          fs.writeFileSync(file, text);
          NODE
      - name: Prove the patch is surgical
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/pages/chativat-beynayim/index.astro"
          grep -q "MiddleSchoolQuickLinks" src/pages/chativat-beynayim/index.astro
      - name: Commit the page wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/chativat-beynayim/index.astro
          git commit -m "feat: show quick-links table on middle-school landing"
          git push origin HEAD:feat/middle-school-quick-links-table-v2-20260809
