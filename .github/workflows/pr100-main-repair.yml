name: Repair PR100 from current main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr100-main-repair.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr100-main-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Report repair run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 100 --body "PR #100 repair run started: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Rebuild PR100 on the exact current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/hero-actions backup/pr100-pre-repair-20260810

          BASE_SHA="$(git rev-parse origin/main)"
          PR_SHA="$(git rev-parse origin/feat/hero-actions)"
          SOURCE_SHA="$(git rev-parse origin/backup/pr100-pre-repair-20260810)"
          export BASE_SHA PR_SHA SOURCE_SHA

          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "PR_SHA=$PR_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          test "$SOURCE_SHA" = "e95fcdac16354e82fe80a291d2b1dff65b5599c2"
          git checkout -B pr100-repaired "$BASE_SHA"

          git show "$SOURCE_SHA:src/pages/index.astro" > src/pages/index.astro
          git show "$SOURCE_SHA:src/components/HeroVideo.astro" > src/components/HeroVideo.astro
          git show "$SOURCE_SHA:tests/ux.spec.ts" > /tmp/pr100-ux.spec.ts

          python - <<'PY'
          from pathlib import Path
          import os, re, subprocess

          # First visit: no blocking splash and no legacy start button.
          p = Path('src/pages/index.astro')
          s = p.read_text()
          s = s.replace("import SplashIntro from '../components/SplashIntro.astro';\n", '')
          s = s.replace('  <SplashIntro />\n', '')
          if 'SplashIntro' in s or 'start-btn' in s:
              raise SystemExit('stale SplashIntro/start-btn remains in homepage')
          p.write_text(s)

          # P2: keep all three lead actions compact and visible on narrow mobile screens.
          p = Path('src/components/HeroVideo.astro')
          s = p.read_text()
          old = '''  @media (max-width: 700px) {
            .hero-clip { inline-size: min(70vw, 280px); }
            .lead-btn { inline-size: min(340px, 92vw); }
          }
          '''
          new = '''  @media (max-width: 700px) {
            .hero-actions {
              order: 2;
              inline-size: min(100%, 350px);
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 0.4rem;
              margin-block-start: 0.1rem;
            }
            .hero-team-lead { order: 3; }
            .hero-team:not(.hero-team-lead) { order: 4; }
            .hero-clip { inline-size: min(70vw, 280px); }
            .lead-btn {
              min-inline-size: 0;
              inline-size: 100%;
              min-block-size: 52px;
              grid-template-columns: 1fr;
              justify-items: center;
              gap: 0.18rem;
              padding: 0.35rem 0.2rem;
              border-radius: 18px;
              text-align: center;
            }
            .lead-icon { inline-size: 30px; block-size: 30px; }
            .lead-copy strong { font-size: clamp(0.72rem, 3vw, 0.86rem); line-height: 1.1; }
            .lead-copy small,
            .lead-arrow { display: none; }
          }
          '''
          if old not in s:
              raise SystemExit('expected PR100 mobile block not found')
          p.write_text(s.replace(old, new, 1))

          # Base: preserve current-main imports/navigation, remove only heroSeen bootstrap.
          p = Path('src/layouts/Base.astro')
          s = p.read_text()
          start = s.find('    {/* סרטון הפתיחה — פעם אחת בכל session של הטאב')
          end = s.find('    <slot name="head" />', start)
          if start < 0 or end < 0:
              raise SystemExit('legacy heroSeen bootstrap block not found safely')
          repl = '    {/* העמוד הראשי עולה מיד — אין מנגנון "נצפה" ואין bootstrap של הסתרה\n        (RULES 6.2, הוראת יניב 10/08/2026). */}\n'
          s = s[:start] + repl + s[end:]
          if 'jerusalem.heroSeen.v1' in s:
              raise SystemExit('heroSeen bootstrap survived')
          p.write_text(s)

          # Global CSS: preserve current-main luxury/table work; remove only hero-done gate.
          p = Path('src/styles/global.css')
          s = p.read_text()
          start = s.find('/* ---------- פתיחת העמוד הראשי: שום כפתור פעולה עד שהתמונה נעלמת ----------')
          end = s.find('/* ============================================================', start)
          if start < 0 or end < 0:
              raise SystemExit('legacy hero-done CSS block not found safely')
          repl = '''/* ---------- העמוד הראשי עולה מיד (RULES 6.2, הוראת יניב 10/08/2026) ----------
             הניווט העליון ופס "מה צפוי?" גלויים וניתנים למיקוד מהרגע הראשון — מנגנון
             ההסתרה עד "סיום הסרטון" נמחק. */

          '''
          s = s[:start] + repl + s[end:]
          if 'html:not(.hero-done)' in s:
              raise SystemExit('hero-done gate survived')
          p.write_text(s)

          # Deploy verification: homepage moves to hero-actions; #98 choice-card must survive.
          p = Path('scripts/verify-deploy.mjs')
          s = p.read_text()
          old = "{ path: '/', needle: 'start-btn', what: 'כפתור ההתחלה בעמוד הראשי (7.28)' }"
          new = "{ path: '/', needle: 'hero-actions', what: 'כפתורי הפעולה המובילים בעמוד הראשי (7.28)' }"
          if old not in s:
              raise SystemExit('current-main start-btn deploy marker not found')
          s = s.replace(old, new, 1)
          if "needle: 'choice-card'" not in s:
              raise SystemExit('#98 choice-card deploy marker was lost')
          p.write_text(s)

          # Interactions: real immediate homepage; no synthetic hero-done reveal.
          p = Path('tests/interactions.spec.ts')
          s = p.read_text()
          old = "test('אחרי הסרטון מופיע צוות ההדרכה — לא תוכן אחר (6.5)', async ({ page }) => {\n  await page.emulateMedia({ reducedMotion: 'reduce' }); // מדלג ישר למצב הסיום\n"
          new = "test('המסך הראשוני מציג את צוות ההדרכה מיד — לא תוכן אחר (6.5)', async ({ page }) => {\n"
          if old not in s:
              raise SystemExit('expected interaction hero test prelude not found')
          s = s.replace(old, new, 1)
          s = s.replace("  await page.evaluate(() => document.documentElement.classList.add('hero-done'));\n", '', 1)
          p.write_text(s)

          p = Path('tests/responsive.spec.ts')
          s = p.read_text()
          old = "        // בעמוד הבית הניווט והפס נחשפים רק אחרי שתמונת הפתיחה נעלמה (6.3)\n        await page.evaluate(() => document.documentElement.classList.add('hero-done'));\n"
          if old not in s:
              raise SystemExit('expected responsive hero-done bypass not found')
          s = s.replace(old, '', 1)
          p.write_text(s)

          # PROJECT_CONTEXT: replace only the obsolete hero row.
          p = Path('docs/PROJECT_CONTEXT.md')
          s = p.read_text()
          rows = (
              '| המסך הראשוני והסרטון | `src/components/HeroVideo.astro` + `public/media/hero-*` | העמוד עולה מיד (RULES 6.2, 10/08/2026): אין מנגנון `heroSeen`, אין bootstrap ב-`Base.astro` ואין הסתרת ניווט/פס; הסרטון לוח קבוע ממוסגר — מושתק, פעם אחת, בלי loop; רגישי תנועה מקבלים poster בלבד; נכסי hero קנוניים בלבד |\n'
              '| כפתורי הפעולה המובילים | `src/components/HeroVideo.astro` (`nav.hero-actions`) | שלושה קישורים — `/chativat-beynayim/`, `/chativa-elyona/`, `/hodaot/` — גלויים מיד, ≥44px, גוון לכל כפתור (RULES 7.28); אין `start-btn`; `/shearim/` חי בכתובתו בלי כניסה מהעמוד הראשי |'
          )
          s, n = re.subn(r'^\| סרטון פתיחה \|.*$', rows, s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('PROJECT_CONTEXT hero row not found')
          p.write_text(s)

          # RULES: transplant only PR100-owned contracts, preserving newer contracts.
          main = Path('RULES.md').read_text()
          feat = subprocess.check_output(['git', 'show', f"{os.environ['SOURCE_SHA']}:RULES.md"], text=True)

          def section(text, start_heading, next_heading):
              a = text.index(start_heading)
              b = text.index(next_heading, a)
              return text[a:b]

          main = main.replace(section(main, '# 6.', '# 7.'), section(feat, '# 6.', '# 7.'), 1)

          def replace_entry(dst, src, num, nxt):
              pat = re.compile(rf'(?ms)^{re.escape(num)}\..*?(?=^{re.escape(nxt)}\.)')
              sm, dm = pat.search(src), pat.search(dst)
              if not sm or not dm:
                  raise SystemExit(f'RULES entry not found: {num}')
              return dst[:dm.start()] + sm.group(0) + dst[dm.end():]

          for num, nxt in [('3.2','3.3'), ('7.28','7.29'), ('19.10','19.11'), ('22.6','22.7')]:
              main = replace_entry(main, feat, num, nxt)

          def get_entry(text, num, nxt):
              pat = re.compile(rf'(?ms)^{re.escape(num)}\..*?(?=^{re.escape(nxt)}\.)')
              m = pat.search(text)
              if not m:
                  raise SystemExit(f'RULES entry not found: {num}')
              return m

          fm, mm = get_entry(feat, '19.34', '19.35'), get_entry(main, '19.34', '19.35')
          fsec, msec = fm.group(0), mm.group(0)
          fb, mb = re.search(r'(?m)^- עמוד הבית:.*$', fsec), re.search(r'(?m)^- עמוד הבית:.*$', msec)
          if not fb or not mb:
              raise SystemExit('RULES 19.34 homepage bullet not found')
          merged = msec[:mb.start()] + fb.group(0) + msec[mb.end():]
          main = main[:mm.start()] + merged + main[mm.end():]

          if 'תנועה רציפה מלמטה למעלה' not in main:
              raise SystemExit('#99 continuous notices contract lost')
          if 'כרטיסי בחירה קטנים' not in main and 'כרטיסי יוקרה קטנים' not in main:
              raise SystemExit('#98 compact choice-card contract lost')
          Path('RULES.md').write_text(main)
          PY

      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm ci --no-audit --no-fund

      - name: Reconcile UX tests and add mobile P2 coverage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';

          const targetPath = 'tests/ux.spec.ts';
          let target = fs.readFileSync(targetPath, 'utf8');
          const source = fs.readFileSync('/tmp/pr100-ux.spec.ts', 'utf8');

          const tests = (text) => {
            const sf = ts.createSourceFile('x.ts', text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
            const out = [];
            for (const st of sf.statements) {
              if (!ts.isExpressionStatement(st) || !ts.isCallExpression(st.expression)) continue;
              const call = st.expression;
              if (!ts.isIdentifier(call.expression) || call.expression.text !== 'test') continue;
              const arg = call.arguments[0];
              if (!arg || (!ts.isStringLiteral(arg) && !ts.isNoSubstitutionTemplateLiteral(arg))) continue;
              out.push({ title: arg.text, start: st.getStart(sf), end: st.getEnd() });
            }
            return out;
          };
          const one = (text, needle) => {
            const found = tests(text).filter((x) => x.title.includes(needle));
            if (found.length !== 1) throw new Error(`Expected one test containing ${needle}; got ${found.length}`);
            return found[0];
          };
          const replaceTest = (to, from = to) => {
            const t = one(target, to), s = one(source, from);
            target = target.slice(0, t.start) + source.slice(s.start, s.end) + target.slice(t.end);
          };

          replaceTest('ה-hero מלא:', 'העמוד הראשי עולה מיד: hero בהיר');
          replaceTest('ה-poster והווידאו באותן מידות', 'הסרטון קבוע וממוסגר:');
          replaceTest('כרטיס צוות: חץ אחד בעיגול בלי כיתוב');
          replaceTest('העמוד הראשי: כפתור "התחל" יחיד', 'העמוד הראשי: שלושה כפתורי פעולה מובילים');
          replaceTest('כפתור "התחל": נחשף רק אחרי', 'כפתורי הפעולה גלויים מיד וממורכזים');
          replaceTest('תמונת הפתיחה פרוסה עד תחתית המסך', 'המסך הראשוני פרוס עד תחתית החלון');
          replaceTest('ניווט עליון: "ישראל ריאלית"');
          replaceTest('פתיחה נקייה: אין כפתורי פעולה', 'העמוד עולה מיד: ניווט, פס וכפתורים גלויים');

          const oldMarker = '/* ===== סרטון הפתיחה — פעם אחת בכל session של הטאב';
          const newMarker = '/* ===== הסרטון — לוח קבוע במסך הראשוני';
          const oldAt = target.indexOf(oldMarker), newAt = source.indexOf(newMarker);
          if (oldAt < 0 || newAt < 0) throw new Error('hero test section marker missing');
          target = target.slice(0, oldAt) + source.slice(newAt);

          target = target.replace(/^\s*await page\.addInitScript\(\(\) => sessionStorage\.setItem\('ycc-splash', '1'\)\);\n/gm, '');
          target = target.replace(/^\s*sessionStorage\.setItem\('ycc-splash', '1'\);\n/gm, '');

          target += `

          for (const vp of [{ width: 360, height: 740 }, { width: 390, height: 844 }]) {
            test(\`כפתורי הפעולה נשארים במסך הראשוני בנייד \${vp.width}×\${vp.height} (7.28)\`, async ({ page }) => {
              await page.setViewportSize(vp);
              await page.goto('/');
              const actions = page.locator('.hero-actions .lead-btn');
              await expect(actions).toHaveCount(3);
              for (const action of await actions.all()) {
                const box = await action.boundingBox();
                expect(box).not.toBeNull();
                if (!box) throw new Error('hero action has no bounding box');
                expect(box.height).toBeGreaterThanOrEqual(44);
                expect(box.y).toBeGreaterThanOrEqual(0);
                expect(box.y + box.height).toBeLessThanOrEqual(vp.height);
              }
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
              expect(overflow).toBeLessThanOrEqual(1);
            });
          }
          `;

          for (const guard of [
            'שני כרטיסי יוקרה קטנים וצבעוניים',
            'ריחוף מרים את הכרטיס בעדינות',
            'הכרטיסים נערמים בלי גלילה אופקית',
            'rail-track',
          ]) {
            if (!target.includes(guard)) throw new Error(`lost newer-main UX coverage: ${guard}`);
          }
          if (target.includes('ycc-splash')) throw new Error('stale ycc-splash bypass remains');
          fs.writeFileSync(targetPath, target);
          NODE
          git diff --check

      - name: Fail-closed contract audit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'SplashIntro' src/pages/index.astro
          ! grep -q 'jerusalem.heroSeen.v1' src/layouts/Base.astro
          ! grep -q 'html:not(.hero-done)' src/styles/global.css
          ! grep -q 'ycc-splash' tests/ux.spec.ts
          grep -q 'hero-actions' src/components/HeroVideo.astro
          grep -q 'grid-template-columns: repeat(3' src/components/HeroVideo.astro
          grep -q "needle: 'hero-actions'" scripts/verify-deploy.mjs
          grep -q "needle: 'choice-card'" scripts/verify-deploy.mjs
          grep -q 'choice-card' src/pages/shearim/index.astro
          grep -q 'rail-track' src/components/NewsRail.astro
          grep -q '\.luxt' src/styles/global.css
          grep -q 'luxury-controls.css' src/layouts/Base.astro
          git diff --check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Full canonical repository quality gate
        run: npm run quality

      - name: Push repaired PR branch only if refs stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/hero-actions
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || { echo 'main advanced during verification' >&2; exit 1; }
          test "$(git rev-parse origin/feat/hero-actions)" = "$PR_SHA" || { echo 'PR100 head advanced during verification' >&2; exit 1; }

          git add RULES.md docs/PROJECT_CONTEXT.md scripts/verify-deploy.mjs \
            src/components/HeroVideo.astro src/layouts/Base.astro src/pages/index.astro \
            src/styles/global.css tests/interactions.spec.ts tests/responsive.spec.ts tests/ux.spec.ts
          git diff --cached --check
          git commit -m "fix(pr100): reconcile immediate homepage with current main"
          NEW_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease=refs/heads/feat/hero-actions:$PR_SHA origin HEAD:refs/heads/feat/hero-actions
          echo "Repaired PR100 head: $NEW_SHA"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 100 --body "PR #100 repair run completed successfully. Full npm run quality passed before the repaired branch was pushed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 100 --body "PR #100 repair run failed before push. Run for diagnosis: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
