name: PR100 deterministic repair

on:
  push:
    branches: [main]
    paths:
      - .github/pr100-run

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr100-deterministic-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Capture stable refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/hero-actions backup/pr100-pre-repair-20260810
          BASE_SHA="$(git rev-parse origin/main)"
          PR_SHA="$(git rev-parse origin/feat/hero-actions)"
          SOURCE_SHA="$(git rev-parse origin/backup/pr100-pre-repair-20260810)"
          test "$SOURCE_SHA" = "e95fcdac16354e82fe80a291d2b1dff65b5599c2"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "PR_SHA=$PR_SHA" >> "$GITHUB_ENV"
          echo "PR100_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          git checkout -B pr100-repaired "$BASE_SHA"

      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm ci --no-audit --no-fund

      - name: Reconcile PR100 with current main
        run: node scripts/repair-pr100.mjs

      - name: Static diff checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -q 'SplashIntro' src/pages/index.astro
          ! grep -q 'jerusalem.heroSeen.v1' src/layouts/Base.astro
          ! grep -q 'html:not(.hero-done)' src/styles/global.css
          ! grep -q 'ycc-splash' tests/ux.spec.ts
          grep -q 'hero-actions' src/components/HeroVideo.astro
          grep -q 'grid-template-columns: repeat(3' src/components/HeroVideo.astro
          grep -q "needle: 'hero-actions'" scripts/verify-deploy.mjs
          grep -q "needle: 'choice-card'" scripts/verify-deploy.mjs
          grep -q 'choice-card' src/pages/shearim/index.astro
          grep -q 'rail-track' src/components/NewsRail.astro
          grep -q '\.luxt' src/styles/global.css
          grep -q 'luxury-controls.css' src/layouts/Base.astro

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Full canonical quality gate
        run: npm run quality

      - name: Push repaired PR100 only if refs stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/hero-actions
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || { echo 'main advanced during verification' >&2; exit 1; }
          test "$(git rev-parse origin/feat/hero-actions)" = "$PR_SHA" || { echo 'PR100 advanced during verification' >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RULES.md docs/PROJECT_CONTEXT.md scripts/verify-deploy.mjs \
            src/components/HeroVideo.astro src/layouts/Base.astro src/pages/index.astro \
            src/styles/global.css tests/interactions.spec.ts tests/responsive.spec.ts tests/ux.spec.ts
          git diff --cached --check
          git commit -m "fix(pr100): reconcile immediate homepage with current main"
          NEW_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease=refs/heads/feat/hero-actions:$PR_SHA origin HEAD:refs/heads/feat/hero-actions
          echo "NEW_SHA=$NEW_SHA" >> "$GITHUB_ENV"

      - name: Report success to PR100
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 100 --body "Deterministic repair completed: PR #100 was rebuilt on current main and the full npm run quality gate passed before push. Repaired head: \`${NEW_SHA}\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report failure to PR100
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 100 --body "Deterministic PR #100 repair failed before the final push. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
