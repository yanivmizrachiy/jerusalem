name: Hygiene Autofix

on:
  push:
    branches:
      - feat/repo-hygiene-final2-20260809

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/repo-hygiene-final2-20260809
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm i -g "npm@$(node -p \"require('./package.json').packageManager.split('@')[1]\")"

      - name: Sync lock metadata only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply symbol-proven dead-code fixes
        run: node scripts/hygiene-dead-code.mjs --fix

      - name: Validate TypeScript/Astro after fixes
        run: npm run check

      - name: Reject whitespace-corrupt patches
        run: git diff --check

      - name: Commit safe autofixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hygiene autofix diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src scripts package.json
          git commit -m "chore: apply safe repo hygiene autofixes"
          git push origin HEAD:feat/repo-hygiene-final2-20260809
