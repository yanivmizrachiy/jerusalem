# שער האיכות האוטומטי (RULES 21.14–21.15): typecheck, build והסוללה המלאה על כל push,
# ואחרי מיזוג ל-main — אימות שהפרודקשן באמת מגיש את הקומיט הזה (RULES 1.14, 4.6).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# ביטול ריצה קודמת רק ב-PR. על main כל ריצה מסיימת, אחרת verify-production
# מבוטל בשקט (GitHub מדווח "cancelled" ולא "failure") והפריסה נשארת לא-מאומתת.
# אינו מעכב את הפריסה עצמה — Vercel פורס מה-push ישירות, לא מ-Actions (RULES 4.15).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm 11 — אותה גרסה שמייצרת את הלוקפייל בסביבת העבודה; בלעדיה
      # לוקפייל שנוצר מקומית נדחה כאן ב-EUSAGE (נתפס ב-04/08/2026)
      - run: npm i -g npm@11
      - run: npm ci --no-audit --no-fund
      - run: npx astro check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # אימות פריסה: רץ רק אחרי מיזוג ל-main, ממתין ל-Vercel ומוכיח שהקומיט חי
  verify-production:
    # always() — Vercel פורס מה-push ל-main בלי קשר ל-Actions (RULES 4.15),
    # ולכן הפרודקשן חייב אימות גם כשהסוללה נפלה או הבהבה. בלי זה בדיקה
    # מהבהבת אחת משאירה פריסה חיה שאיש לא אימת.
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: הפרודקשן מגיש את הקומיט הזה וכל הסמנים חיים
        run: node scripts/verify-deploy.mjs --sha "${GITHUB_SHA:0:7}" --timeout 480
