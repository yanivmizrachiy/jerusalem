# שער האיכות האוטומטי (RULES 21.14–21.17): חוזה יחיד, fail-closed, על כל PR ועל main.
# אחרי מיזוג ל-main מאמתים גם שהפרודקשן באמת מגיש את הקומיט שנבדק.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# ביטול ריצה קודמת רק ב-PR. על main כל ריצה מסיימת כדי שאימות הפרודקשן
# של כל קומיט שנכנס ל-main לא ייעלם בשקט.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm 11 — אותה גרסה שמייצרת את הלוקפייל בסביבת העבודה; בלעדיה
      # לוקפייל שנוצר מקומית עלול להידחות כאן ב-EUSAGE.
      - run: npm i -g npm@11
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # מקור אמת יחיד: repo-health → check → build → Playwright עם retries=0
      # ופורט פנוי אוטומטי. אותה פקודה מיועדת גם להרצה מקומית.
      - run: npm run quality
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # אימות פריסה רץ רק אם שער quality עבר. אם quality נכשל — אין "אימות הצלחה"
  # לפריסה של אותו קומיט. הגנת main צריכה לחייב quality לפני merge.
  verify-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: הפרודקשן מגיש את הקומיט הזה וכל הסמנים חיים
        run: node scripts/verify-deploy.mjs --sha "${GITHUB_SHA:0:7}" --timeout 480
