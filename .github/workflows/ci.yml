# שער האיכות האוטומטי (RULES 21.14–21.17): חוזה יחיד, fail-closed, על כל PR ועל main.
# אחרי מיזוג ל-main מאמתים גם שהפרודקשן באמת מגיש בדיוק את הקומיט שנבדק.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# ברירת המחדל של ה-workflow היא read-only. כל שינוי עתידי שיצטרך כתיבה חייב
# לבקש הרשאה מפורשת ב-job עצמו ולא לקבל אותה בירושה במקרה.
permissions:
  contents: read

# ביטול ריצה קודמת רק ב-PR. על main כל ריצה מסיימת כדי שאימות הפרודקשן
# של כל קומיט שנכנס ל-main לא ייעלם בשקט.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # אבחון קריאה־בלבד וזמני לענף #91. נמחק אחרי שנקבל zero-consumer proof.
  hygiene-reference-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/final-hygiene-current-main-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Probe remaining duplicate/dead exports
        run: node scripts/hygiene-reference-probe.mjs

  # שינוי חד־פעמי ומוגן: רץ רק בענף #91 ורק אחרי שה-probe הוכיח consumer יחיד.
  grade-count-autofix:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/final-hygiene-current-main-20260809' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: התקנת גרסת npm המוצמדת
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci --no-audit --no-fund
      - name: Consolidate grade count onto canonical source
        run: node scripts/consolidate-grade-count.mjs
      - name: Validate transformed sources
        run: npm run check
      - run: git diff --check
      - name: Commit proven consolidation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publishing.ts src/pages/chativat-beynayim/index.astro
          git commit -m "cleanup: consolidate grade counts onto canonical source"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # גרסת npm מוצמדת ב-package.json (packageManager) ונקראת ממנו, כדי
      # ששרשרת ההתקנה תהיה זהה בכל ריצה. ‏npm@11 צף התקין גרסה אחרת בכל
      # פעם, והלוקפייל שנוצר מקומית נדחה כאן ב-EUSAGE.
      - name: התקנת גרסת npm המוצמדת
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci --no-audit --no-fund
      # שער תלויות בעל רעש נמוך: חוסם אך ורק פגיעוּת Critical בתלויות
      # ההפקה. נמדד 09/08/2026 שקיימות 4 פגיעוּיות High פתוחות
      # (path-to-regexp דרך @astrojs/vercel) — הן נכסי בנייה וניתוב ואינן
      # נשלחות לדפדפן, ושדרוגן דורש שדרוג אדפטר. לכן High מדווח ואינו
      # חוסם, ו-Critical חוסם: היום יש 0 כאלה, כך שהשער fail-closed מבלי
      # לצבוע את הצינור אדום ביום הראשון.
      - name: פגיעוּת Critical בתלויות הפקה חוסמת
        run: npm audit --omit=dev --audit-level=critical
      - name: דוח פגיעוּיות High (מדווח, אינו חוסם)
        if: always()
        run: npm audit --omit=dev --audit-level=high || true
      - run: npx playwright install --with-deps chromium
      # מקור אמת יחיד: repo-health → dead-code hygiene → check → build → Playwright עם retries=0
      # ופורט פנוי אוטומטי. אותה פקודה מיועדת גם להרצה מקומית.
      - run: npm run quality
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # אימות פריסה רץ רק אם שער quality עבר. אם quality נכשל — אין "אימות הצלחה"
  # לפריסה של אותו קומיט. הגנת main צריכה לחייב quality לפני merge.
  verify-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: הפרודקשן מגיש את הקומיט הזה וכל הסמנים חיים
        run: node scripts/verify-deploy.mjs --sha "${GITHUB_SHA:0:7}" --timeout 480
