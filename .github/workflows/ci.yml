# שער האיכות האוטומטי (RULES 21.14–21.17): חוזה יחיד, fail-closed, על כל PR ועל main.
# אחרי מיזוג ל-main מאמתים גם שהפרודקשן באמת מגיש בדיוק את הקומיט שנבדק.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-script-policy-autofix:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/final-hygiene-current-main-20260809' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - name: Install current locked tree for review
        run: npm ci --no-audit --no-fund
      - name: Approve only the reviewed esbuild install script, pinned to its installed version
        run: npm install-scripts approve esbuild
      - name: Make any future unreviewed install script fail closed
        run: printf 'strict-allow-scripts=true\n' > .npmrc
      - name: Reinstall from scratch under the strict policy
        shell: bash
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund
      - name: Prove no install script remains pending review
        run: npm install-scripts ls
      - run: git diff --check
      - name: Commit npm-generated install-script policy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .npmrc
          git commit -m "security: pin reviewed esbuild install script policy"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: התקנת גרסת npm המוצמדת
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci --no-audit --no-fund
      - name: פגיעוּת Critical בתלויות הפקה חוסמת
        run: npm audit --omit=dev --audit-level=critical
      - name: דוח פגיעוּיות High (מדווח, אינו חוסם)
        if: always()
        run: npm audit --omit=dev --audit-level=high || true
      - run: npx playwright install --with-deps chromium
      # מקור אמת יחיד: repo-health → dead-code hygiene → ModEL rebuild → check → build → Playwright, retries=0.
      - run: npm run quality
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  verify-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: הפרודקשן מגיש את הקומיט הזה וכל הסמנים חיים
        run: node scripts/verify-deploy.mjs --sha "${GITHUB_SHA:0:7}" --timeout 480
