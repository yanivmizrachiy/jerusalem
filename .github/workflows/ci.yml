# שער האיכות האוטומטי (RULES 21.14–21.17): חוזה יחיד, fail-closed, על כל PR ועל main.
# אחרי מיזוג ל-main מאמתים גם שהפרודקשן באמת מגיש בדיוק את הקומיט שנבדק.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sharp-lock-autofix:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/final-hygiene-current-main-20260809' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - name: Synchronize lock metadata with npm itself
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove exact locked install
        run: npm ci --no-audit --no-fund
      - name: Prove ModEL logo generator is byte-stable
        shell: bash
        run: |
          before="$(sha256sum public/media/brands/moodle-logo.png | cut -d' ' -f1)"
          node scripts/build-moodle-logo.mjs
          after="$(sha256sum public/media/brands/moodle-logo.png | cut -d' ' -f1)"
          test "$before" = "$after"
          git diff --exit-code -- public/media/brands/moodle-logo.png
      - run: git diff --check
      - name: Commit npm-generated lock metadata
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync lockfile for direct sharp dependency"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: התקנת גרסת npm המוצמדת
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci --no-audit --no-fund
      - name: פגיעוּת Critical בתלויות הפקה חוסמת
        run: npm audit --omit=dev --audit-level=critical
      - name: דוח פגיעוּיות High (מדווח, אינו חוסם)
        if: always()
        run: npm audit --omit=dev --audit-level=high || true
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  verify-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: הפרודקשן מגיש את הקומיט הזה וכל הסמנים חיים
        run: node scripts/verify-deploy.mjs --sha "${GITHUB_SHA:0:7}" --timeout 480
