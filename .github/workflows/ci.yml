# שער האיכות האוטומטי (RULES 21.14–21.17): חוזה יחיד, fail-closed, על כל PR ועל main.
# אחרי מיזוג ל-main מאמתים גם שהפרודקשן באמת מגיש בדיוק את הקומיט שנבדק.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# ברירת המחדל של ה-workflow היא read-only. כל שינוי עתידי שיצטרך כתיבה חייב
# לבקש הרשאה מפורשת ב-job עצמו ולא לקבל אותה בירושה במקרה.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: התקנת גרסת npm המוצמדת
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci --no-audit --no-fund
      - name: פגיעוּת Critical בתלויות הפקה חוסמת
        run: npm audit --omit=dev --audit-level=critical
      - name: דוח פגיעוּיות High (מדווח, אינו חוסם)
        if: always()
        run: npm audit --omit=dev --audit-level=high || true
      - run: npx playwright install --with-deps chromium
      # מקור אמת יחיד: repo-health → dead-code hygiene → Moodle logo rebuild → check → typecheck:tests → build → Playwright, retries=0.
      - run: npm run quality
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  cross-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: התקנת גרסת npm המוצמדת
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run build
      - name: Firefox + WebKit critical smoke
        run: npx playwright test --config=playwright.cross-browser.config.ts --retries=0
      - name: Upload cross-browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-traces
          path: test-results/
          retention-days: 7

  verify-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: הפרודקשן מגיש את הקומיט הזה וכל הסמנים חיים
        run: node scripts/verify-deploy.mjs --sha "${GITHUB_SHA:0:7}" --timeout 480
