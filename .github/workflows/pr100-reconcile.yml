name: PR100 reconcile once

on:
  push:
    branches: [feat/hero-actions]
    paths:
      - .github/workflows/pr100-reconcile.yml

permissions:
  contents: write

concurrency:
  group: pr100-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feat/hero-actions

      - name: Merge current main without regressing newer contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X theirs origin/main
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Re-assert PR100 homepage contracts after merge
        shell: python
        run: |
          from pathlib import Path

          # First visit must truly be immediate: no SplashIntro import/render.
          p = Path('src/pages/index.astro')
          s = p.read_text()
          s = s.replace("import SplashIntro from '../components/SplashIntro.astro';\n", '')
          s = s.replace('  <SplashIntro />\n', '')
          p.write_text(s)

          # The obsolete session bootstrap must not survive a conflict resolution.
          p = Path('src/layouts/Base.astro')
          s = p.read_text()
          if 'jerusalem.heroSeen.v1' in s:
            start = s.find('    {/* סרטון הפתיחה — פעם אחת')
            end = s.find('    <slot name="head" />', start)
            if start < 0 or end < 0:
              raise SystemExit('Could not safely remove legacy heroSeen bootstrap')
            replacement = '    {/* העמוד הראשי עולה מיד — אין מנגנון "נצפה" ואין bootstrap של הסתרה\n        (RULES 6.2, הוראת יניב 10/08/2026). */}\n'
            s = s[:start] + replacement + s[end:]
            p.write_text(s)

          # Keep main's newer global styles (#101) but remove the old hero-done gate.
          p = Path('src/styles/global.css')
          s = p.read_text()
          if 'html:not(.hero-done)' in s:
            start = s.find('/* ---------- פתיחת העמוד הראשי:')
            end = s.find('/* ============================================================', start)
            if start < 0 or end < 0:
              raise SystemExit('Could not safely remove legacy hero-done CSS gate')
            replacement = '/* ---------- העמוד הראשי עולה מיד (RULES 6.2, הוראת יניב 10/08/2026) ----------\n   הניווט העליון ופס "מה צפוי?" גלויים וניתנים למיקוד מהרגע הראשון — מנגנון\n   ההסתרה עד "סיום הסרטון" נמחק. */\n\n'
            s = s[:start] + replacement + s[end:]
            p.write_text(s)

          # Preserve BOTH contracts: PR100 hero-actions and #98 compact choice cards.
          p = Path('scripts/verify-deploy.mjs')
          s = p.read_text()
          s = s.replace("{ path: '/', needle: 'start-btn', what: 'כפתור ההתחלה בעמוד הראשי (7.28)' },",
                        "{ path: '/', needle: 'hero-actions', what: 'כפתורי הפעולה המובילים בעמוד הראשי (7.28)' },")
          s = s.replace("{ path: '/shearim/', needle: 'split-rule', what: 'המסך המחולק חצי-חצי בבחירת החטיבה (7.29)' },",
                        "{ path: '/shearim/', needle: 'choice-card', what: 'כרטיסי הבחירה המעודנים בבחירת החטיבה (7.29)' },")
          p.write_text(s)

          # Tests must exercise a genuinely fresh first visit; no hidden splash bypass.
          p = Path('tests/ux.spec.ts')
          s = p.read_text()
          bypass = "  await page.addInitScript(() => sessionStorage.setItem('ycc-splash', '1'));\n"
          s = s.replace(bypass, '')
          p.write_text(s)

      - name: Remove this one-time workflow from the resulting PR
        run: rm .github/workflows/pr100-reconcile.yml

      - name: Fail-closed contract audit before expensive tests
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'SplashIntro' src/pages/index.astro
          ! grep -q 'ycc-splash' tests/ux.spec.ts
          ! grep -q 'jerusalem.heroSeen.v1' src/layouts/Base.astro
          ! grep -q 'html:not(.hero-done)' src/styles/global.css
          grep -q 'hero-actions' src/components/HeroVideo.astro
          grep -q "needle: 'hero-actions'" scripts/verify-deploy.mjs
          grep -q "needle: 'choice-card'" scripts/verify-deploy.mjs
          grep -q 'choice-card' src/pages/shearim/index.astro
          grep -q 'rail-track' src/components/NewsRail.astro
          grep -q '\.luxt' src/styles/global.css
          grep -q 'העמוד הראשי עולה מיד' RULES.md
          git diff --check

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Full repository quality gate
        run: npm run quality

      - name: Commit and push only after all gates are green
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "merge: reconcile PR #100 with current main [quality-green]"
          git push origin HEAD:feat/hero-actions
