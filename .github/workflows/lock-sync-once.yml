name: One-time lock sync

on:
  push:
    branches:
      - feat/final-hygiene-current-main-20260809

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/final-hygiene-current-main-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - name: Let npm synchronize lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove clean locked install
        run: npm ci --no-audit --no-fund
      - name: Prove ModEL logo build is byte-stable
        shell: bash
        run: |
          before="$(sha256sum public/media/brands/moodle-logo.png | cut -d' ' -f1)"
          node scripts/build-moodle-logo.mjs
          after="$(sha256sum public/media/brands/moodle-logo.png | cut -d' ' -f1)"
          test "$before" = "$after"
          git diff --exit-code -- public/media/brands/moodle-logo.png
      - name: Reject malformed lock diff
        run: git diff --check
      - name: Commit npm-generated lock metadata
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync lockfile for direct sharp dependency"
          git push origin HEAD:feat/final-hygiene-current-main-20260809
