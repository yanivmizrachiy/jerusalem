name: plan-prisa extract (temporary)

on:
  push:
    branches:
      - feat/plan-prisa-html-20260810
    paths:
      - .github/workflows/plan-prisa-extract.yml
      - scripts/finalize-plan-prisa-html.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final fail-closed contracts
        run: node scripts/finalize-plan-prisa-html.mjs
      - name: Commit final plan/prisa contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/quick-links-contracts.spec.ts src/components/PlanPrisaWeb.astro src/components/ResourceSplit.astro scripts/verify-deploy.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Final plan/prisa contracts are already current."
            exit 0
          fi
          git commit -m "test(plan-prisa): enforce HTML reader contracts"
          git push origin HEAD:feat/plan-prisa-html-20260810
