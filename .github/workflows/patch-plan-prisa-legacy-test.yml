name: patch superseded plan-prisa PDF contract (temporary)

on:
  push:
    branches: [feat/plan-prisa-html-20260810]
    paths: [.github/workflows/patch-plan-prisa-legacy-test.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Replace superseded PDF iframe contract
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/embed-production-guards.spec.ts')
          s = p.read_text(encoding='utf-8')
          old = '''test('PDF מבקש התאמה לרוחב כבר בכתובת ההטמעה', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto('/chativat-beynayim/reader/z/tochnit-z/');

            const iframe = page.locator('.res-frame iframe').first();
            const requestedSource = (await iframe.getAttribute('src')) ?? (await iframe.getAttribute('data-esrc')) ?? '';
            expect(requestedSource, 'מציג ה-PDF נפתח במצב התאמה לרוחב').toContain('view=FitH');

            const aspectRatio = await iframe.evaluate((node) => getComputedStyle(node).aspectRatio);
            expect(aspectRatio, 'יחס A4 מוגדר גם כאשר הדפדפן מחליף את מציג ה-PDF').toContain('1');
          });'''
          new = '''test('תוכנית/פריסה מוצגת כעמוד HTML אמיתי ולא כ-PDF מוטמע', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto('/chativat-beynayim/reader/z/tochnit-z/');

            const webReader = page.locator('[data-plan-prisa-web]');
            await expect(webReader, 'תצוגת האינטרנט המלאה קיימת').toHaveCount(1);
            await expect(page.locator('.res-view iframe'), 'אין iframe/PDF viewer בתוכנית ההוראה').toHaveCount(0);
            expect(await webReader.locator('[data-pp-row]').count(), 'המלל מוצג כשורות HTML אמיתיות').toBeGreaterThan(10);
            await expect(page.locator('a[href="/docs/plan-7-tashpaz.pdf"]').first(), 'ה-PDF הרשמי נשאר להורדה בלבד').toBeVisible();
          });'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one old contract, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-plan-prisa-legacy-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/embed-production-guards.spec.ts .github/workflows/patch-plan-prisa-legacy-test.yml
          git diff --cached --check
          git commit -m "test(plan-prisa): replace superseded PDF iframe guard"
          git push origin HEAD:feat/plan-prisa-html-20260810
