name: Security safe audit fix

on:
  push:
    branches:
      - security/high-audit-safe-20260911

permissions:
  contents: write

jobs:
  safe-audit-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/high-audit-safe-20260911
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Apply only non-breaking npm audit fixes
        run: npm audit fix --omit=dev --no-audit --no-fund || true
      - name: Capture remaining production audit
        run: npm audit --omit=dev --audit-level=high || true
      - name: Verify dependency graph and project
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=critical
          npm run check
          npm run typecheck:tests
          npm run build
      - name: Commit only verified dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No safe dependency changes to commit"
            exit 0
          fi
          git commit -m "fix(security): apply non-breaking audit fixes"
          git push origin HEAD:security/high-audit-safe-20260911
